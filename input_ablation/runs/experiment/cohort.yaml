      calving:
        c_max: 20000.0
        k: 5.0
      cfl: 0.3
      cfl_percentile: 100.0
      end: 10.0
      marine:
        front:
          first_order: true
          fixed: false
          method: sub_grid
          min_thickness: 5.0
          sub_grid:
            max_iterations: 10
            residual: redistribute
          threshold: flux
        ratio_density: 0.8929961089494164
        remove_rigid_body_modes: true
        scheme: explicit
      save: 1.0
      slope_type: superbee
      smb:
      - - 0
        - 0.005
        - 0.001
        - 900
        - 0.5
      smb_update_frequency: 1.0
      start: 0.0
      step_max: 1.0
    transfer:
      anchor_interval: 1.0
      anchor_lr: 0.001
      anchor_start: 1.0
      anchor_steps: 20000
      correction_lr: 5.0e-05
      correction_steps: 10
      count: 9
      fine_dt: 0.05
    validation_only: false
models:
  aletsch_Backbone_raw:
    spec:
      family: controlled_backbone
      features: []
      params:
        conv_ker_size: 3
        nb_layers: 6
        nb_out_filter: 24
        residual: true
    selection:
      kind: common_backbone
  aletsch_Backbone_3f:
    spec:
      family: controlled_backbone
      features:
      - dsdx
      - dsdy
      - grad_s
      params:
        conv_ker_size: 3
        nb_layers: 6
        nb_out_filter: 24
        residual: true
    selection:
      kind: common_backbone
  aletsch_Backbone_5f:
    spec:
      family: controlled_backbone
      features:
      - dsdx
      - dsdy
      - grad_s
      - u_sia
      - u_weertman
      params:
        conv_ker_size: 3
        nb_layers: 6
        nb_out_filter: 24
        residual: true
    selection:
      kind: common_backbone
  aletsch_Backbone_scrambled:
    spec:

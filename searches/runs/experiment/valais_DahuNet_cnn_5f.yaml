# @package _global_
defaults:
- override /inputs:
  - local
- override /processes:
  - online_initialize
  - smb
  - time
  - thk
  - online_geometry
  - iceflow
  - online_save
- override /outputs: []
core:
  check_compat_params: false
  check_module_needs: false
  print_info: false
  print_params: false
  hardware:
    visible_gpus:
    - 0
hydra:
  run:
    dir: ${hydra:runtime.cwd}/../../results/rerun/valais/paper/online/DahuNet_cnn_5f/seed42624703/engine/${now:%Y%m%d_%H%M%S_%f}
  job:
    chdir: true
inputs:
  local:
    filename: ${hydra:runtime.cwd}/../../glaciers/runs/data/valais.nc
    coarsening:
      ratio: 1
    crop: {}
processes:
  smb:
    method: simple
    simple:
      update_freq: 1.0
      array:
      - - time
        - gradabl
        - gradacc
        - ela
        - accmax
      - &id004
        - 0
        - 0.009
        - 0.005
        - 3000
        - 2.0
      - &id005
        - 200
        - 0.009
        - 0.005
        - 2900
        - 2.0
      - &id006
        - 300
        - 0.009
        - 0.005
        - 2500
        - 2.0
      - &id007
        - 500
        - 0.009
        - 0.005
        - 3300
        - 2.0
  time:
    start: 200.0
    end: 500.0
    save: 10.0
    cfl: 0.3
    cfl_percentile: 100.0
    step_max: 1.0
  thk:
    slope_type: superbee
    remove_rigid_body_modes: false
    ratio_density: 0.91
  iceflow:
    method: unified
    physics:
      energy_components: &id002
      - viscosity
      - gravity
      - sliding
      gravity_cst: 9.81
      ice_density: 910.0
      water_density: 1000.0
      thr_ice_thk: 0.1
      min_sr: 1.0e-20
      max_sr: 1.0e+20
      cf_eswn: &id001 []
      viscosity:
        arrhenius: 78.0
        enhancement_factor: 1.0
        exponent: 3.0
        regularization: 1.0e-05
      sliding:
        law: weertman
        use_mask_gr: false
        use_subgrid_gl: false
        slidingco: 0.0464
        tau_ref: 0.2153697218796329
        exponent: 3.0
        regularization: 1.0
        u_ref: 100.0
      minimum_ice_thickness: 0.01
      remove_rigid_body_modes: true
    numerics:
      precision: single
      Nz: 2
      basis_horizontal: q1
      basis_vertical: molho
      vert_spacing: 4.0
    unified:
      mapping: network
      optimizer: adam
      inputs:
      - thk
      - usurf
      - arrhenius
      - tau_ref
      - dX
      bcs: &id003 []
      nbit_init: 900
      nbit: 5
      retrain_freq: 45
      nbit_warmup: -1
      init_stop:
        enabled: false
      adaptive_time:
        method: none
      adaptive_patching:
        enabled: false
      network:
        architecture: dahunet
        pretrained: false
        fp16_inference: false
        seed: 42624703
        params: ${study.network_params}
      adam:
        lr: 0.0004536262962666264
        lr_init: 0.004793556713177311
        optimizer_clipnorm: 1.0
      halt:
        success: []
        failure: []
      display:
        print_cost: false
      data_preparation:
        framesizemax: 100000000
        patches_per_batch: 1
study:
  workflow: online
  args:
    case: valais
    profile: paper
    seed: 42624703
    gpu: cpu
    output: ${hydra:runtime.cwd}/../../results
    namespace: rerun
    reference_source: null
    resume: false
    retry_failed: false
    defer_scoring: false
  config:
    case: valais
    input: glaciers/runs/data/valais.nc
    metrics:
      historical_ice_threshold: 1.0
      selection_criterion: median
      speed_offset: 10.0
      threshold_percent: 5.0
    online:
      beta1: 0.8
      beta2: 0.9995
      clipnorm: 1.0
      lr: 0.0004536262962666264
      lr_init: 0.004793556713177311
      nbit: 5
      nbit_init: 900
      retrain_freq: 45
    physics:
      Nz: 2
      arrhenius: 78.0
      cf_eswn: *id001
      energy_components: *id002
      glen_exponent: 3.0
      gravity: 9.81
      horizontal: q1
      ice_density: 910.0
      ice_threshold: 0.1
      imposed_bcs: *id003
      max_sr: 1.0e+20
      min_sr: 1.0e-20
      minimum_ice_thickness: 0.01
      remove_rigid_body_modes: true
      sliding_exponent: 3.0
      sliding_regularization: 1.0
      slidingco: 0.0464
      strain_regularization: 1.0e-05
      u_ref: 100.0
      use_mask_gr: false
      vertical: molho
      water_density: 1000.0
    profile: paper
    reference:
      fp32_policy: retain_candidate
      fp32_saved_frame_checks: true
    runtime:
      checkpoint_interval_seconds: 60.0
      compress_checkpoints: false
    solver:
      adaptive_damping: true
      block_iterations: 8
      cg_max_iter: 4000
      cg_tol: 0.01
      consecutive_updates: 3
      damping: 1.0e-16
      damping_min: 1.0e-26
      independent_refinement_steps:
      - 3
      - 7
      independent_rms: 0.1
      independent_starts: true
      line_search: armijo
      max_blocks: 64
      max_newton_iterations: 200
      operator: banded
      preconditioner: barotropic_multigrid
      probe_batch: 1
      refinement_rms: 0.001
      relative_gradient: 0.001
      stagnant_blocks: 3
      stagnation_rms: 1.0e-06
      stopping: marine_velocity
      timeout_seconds: 14400
      velocity_tolerance: 0.1
      warm_start: false
    sweep:
      architectures:
      - MLP
      - CNN
      - FNO2
      - DahuNet_cnn_3f
      - DahuNet_cnn_5f
      - DahuNet_fno_3f
      - DahuNet_fno_5f
      - DahuNet_scramble
      conditions:
      - inclusive
      pareto_trials: 500
      population: 20
      reevaluation_seeds:
      - 0
      - 1
      - 2
      trial_timeout_seconds: 14400
      uniform_trials: 50
    time:
      cfl: 0.3
      cfl_percentile: 100.0
      end: 500.0
      save: 10.0
      slope_type: superbee
      smb:
      - *id004
      - *id005
      - *id006
      - *id007
      smb_update_frequency: 1.0
      start: 200.0
      step_max: 1.0
    transfer:
      anchor_interval: 10.0
      anchor_lr: 0.002
      anchor_start: 200.0
      anchor_steps: 20000
      correction_lr: 5.0e-05
      correction_steps: 10
      count: 30
      fine_dt: 0.05
    validation_only: false
  architecture: DahuNet_cnn_5f
  architecture_spec:
    family: dahunet
    backend: cnn
    features: &id008
    - dsdx
    - dsdy
    - grad_s
    - u_sia
    - u_weertman
    params:
      nb_layers: 6
      nb_out_filter: 24
      conv_ker_size: 3
      residual: true
  directory: ${hydra:runtime.cwd}/../../results/rerun/valais/paper/online/DahuNet_cnn_5f/seed42624703
  network_params:
    nb_layers: 6
    nb_out_filter: 24
    conv_ker_size: 3
    residual: true
    backend: cnn
    features: *id008
